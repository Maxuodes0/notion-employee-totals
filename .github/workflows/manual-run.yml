name: Test

on:
  workflow_dispatch:         # تقدر تشغّله يدويًا أيضًا

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: notion-employee-totals
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run main.py
        env:
          # عندك هذول محفوظين كـ Secrets (حسب صورتك)
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EMP_TOTALS_PARENT_PAGE_ID: ${{ secrets.EMP_TOTALS_PARENT_PAGE_ID }}

          # (اختياري) لو حاب تمرّرها كـ Variable من Settings→Variables
          PROJECTS_DB_ID: ${{ vars.PROJECTS_DB_ID }}

          # لتفادي رسالة "This API is deprecated"
          NOTION_VERSION: "2025-09-03"
        run: |
          python project_profit.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-employee-totals-logs
          path: run.log
          retention-days: 7
