name: Notion Employee Totals (every 60 min)

on:
  schedule:
    - cron: "*/60 * * * *"    # كل 5 دقيقة (UTC)
  workflow_dispatch:         # تقدر تشغّله يدويًا أيضًا

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: notion-employee-totals
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run main.py
        env:
          # موجودة عندك كـ Secrets حسب الصورة
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EMP_TOTALS_PARENT_PAGE_ID: ${{ secrets.EMP_TOTALS_PARENT_PAGE_ID }}

          # (اختياري) إذا حاطّه كـ Variable
          PROJECTS_DB_ID: ${{ vars.PROJECTS_DB_ID }}

          # لتفادي رسالة "This API is deprecated"
          NOTION_VERSION: "2025-09-03"

          # (اختياري) لو تبي تمنع الإنشاء وتكتب على قاعدة معيّنة فقط:
          # EMP_TOTALS_DB_ID: ${{ vars.EMP_TOTALS_DB_ID }}
        run: |
          python main.py | tee run.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-employee-totals-logs
          path: run.log
          retention-days: 7
