name: Notion قواعد البيانات (every 30 minutes)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: notion-employee-totals
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      # ===== 1) تجميع مبالغ الموظفين =====
      - name: Run main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          EMP_TOTALS_PARENT_PAGE_ID: ${{ secrets.EMP_TOTALS_PARENT_PAGE_ID }}
          PROJECTS_DB_ID: ${{ vars.PROJECTS_DB_ID }}
          NOTION_VERSION: "2022-06-28"
        run: |
          python main.py | tee run_main.log

      # ===== 2) ربحية المشاريع =====
      - name: Run project_profit.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROFIT_PARENT_PAGE_ID: ${{ secrets.EMP_TOTALS_PARENT_PAGE_ID }}
          PROJECTS_DB_ID: ${{ vars.PROJECTS_DB_ID }}
          VAT_RATE: "0.15"
          NOTION_VERSION: "2022-06-28"
        run: |
          python project_profit.py | tee run_profit.log

      # ===== 3) التقرير التفصيلي =====
      - name: Run detailed_report.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PROJECTS_DB_ID: ${{ vars.PROJECTS_DB_ID }}
          DETAILED_REPORT_DB_ID: ${{ secrets.DETAILED_REPORT_DB_ID }}
          EMP_TOTALS_DB_ID: ${{ secrets.EMP_TOTALS_DB_ID }}
          NOTION_VERSION: "2022-06-28"
        run: |
          python detailed_report.py | tee run_detailed.log

      # ===== رفع اللوقات =====
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notion-all-scripts-logs
          path: |
            run_main.log
            run_profit.log
            run_detailed.log
          retention-days: 7
